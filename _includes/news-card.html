<article class="news-card" data-category="{{ include.post.category }}">
  <a class="news-image-link" href="{{ include.post.url | relative_url }}">
    <img src="{{ include.post.image | relative_url }}" alt="{{ include.post.image_alt | default: include.post.title }}">
  </a>
  <div class="news-body">
    <p class="meta">{{ include.post.date | date: "%d %b %Y" }} · {{ include.post.category_label | default: include.post.category }}</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.summary }}</p>
    <a class="text-link" href="{{ include.post.url | relative_url }}">Read story →</a>
  </div>
</article>
