# EDIT THIS FILE to change the three research pillars or their images.
- number: "01"
  title: "Dynamics in distribution and stability of biodiversity"
  short_title: "Biodiversity dynamics"
  image: "/assets/images/research/biodiversity-dynamics.jpg"
  alt: "Birdwatching and biodiversity field observation"
  description: >-
    I investigate how land-use and climate change reshape species distributions,
    migration connectivity, phenology, community composition, and population stability
    across regional to continental scales.
  keywords:
    - Species redistribution
    - Community stability
    - Climate and land-use change

- number: "02"
  title: "Spatial prioritization for biodiversity conservation"
  short_title: "Conservation priorities"
  image: "/assets/images/research/conservation-prioritisation.jpg"
  alt: "Presentation of migration-network conservation research"
  description: >-
    I develop network and spatial-prioritisation approaches to identify important habitats,
    evaluate protected-area systems, and translate ecological evidence into conservation
    decisions across migratory pathways and continental biodiversity networks.
  keywords:
    - Ecological networks
    - Protected areas
    - Decision support

- number: "03"
  title: "Wildlife and zoonotic diseases"
  short_title: "One Health"
  image: "/assets/images/research/one-health.jpg"
  alt: "A bird being sampled during wildlife disease research"
  description: >-
    I model broad-scale pathogen and disease-risk patterns in birds, bats, and mammals,
    linking host diversity, life history, climate, habitat change, and movement within a
    One Health framework.
  keywords:
    - Wildlife pathogens
    - Zoonotic risk
    - Host–environment relationships
